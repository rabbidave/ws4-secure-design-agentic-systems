<svg viewBox="0 0 700 540" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<title>Inventory versus Activity, and the three portability axes both must clear</title>
<desc>Diagram showing that per-forward-pass inventory records of bound tool schemas cannot distinguish which tool was actually invoked, and that both the inventory chain and the proposed activity chain must be implementation-agnostic, protocol-agnostic, and environment-agnostic to be trustworthy.</desc>

<rect x="0" y="0" width="700" height="540" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

<defs>
  <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Portability strip -->
<text x="30" y="30" font-size="13" font-weight="600" fill="#334155">Portable across:</text>
<rect x="200" y="16" width="150" height="28" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
<text x="275" y="30" font-size="12" font-weight="500" fill="#334155" text-anchor="middle" dominant-baseline="central">Implementation</text>
<rect x="360" y="16" width="150" height="28" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
<text x="435" y="30" font-size="12" font-weight="500" fill="#334155" text-anchor="middle" dominant-baseline="central">Protocol</text>
<rect x="520" y="16" width="150" height="28" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
<text x="595" y="30" font-size="12" font-weight="500" fill="#334155" text-anchor="middle" dominant-baseline="central">Environment</text>
<line x1="350" y1="44" x2="350" y2="75" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 3"/>

<!-- Container 1: Inventory chain -->
<rect x="31" y="75" width="638" height="155" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
<text x="51" y="100" font-size="14" font-weight="600" fill="#1e3a8a">Inventory chain: Discovery [5050]</text>
<text x="51" y="118" font-size="12" fill="#3b82f6">What was addressable to the model</text>

<rect x="51" y="145" width="186" height="56" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
<text x="144" y="163" font-size="14" font-weight="600" fill="#1e3a8a" text-anchor="middle" dominant-baseline="central">FP1</text>
<text x="144" y="181" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">search, calc</text>

<rect x="257" y="145" width="186" height="56" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
<text x="350" y="163" font-size="14" font-weight="600" fill="#1e3a8a" text-anchor="middle" dominant-baseline="central">FP2</text>
<text x="350" y="181" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">search, calc, delete</text>

<rect x="463" y="145" width="186" height="56" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
<text x="556" y="163" font-size="14" font-weight="600" fill="#1e3a8a" text-anchor="middle" dominant-baseline="central">FP3</text>
<text x="556" y="181" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">search, calc, delete</text>

<line x1="237" y1="173" x2="257" y2="173" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow2)"/>
<line x1="443" y1="173" x2="463" y2="173" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow2)"/>

<!-- Vertical connectors from inventory to activity -->
<line x1="144" y1="201" x2="144" y2="325" stroke="#94a3b8" stroke-width="0.75" stroke-dasharray="4 3"/>
<line x1="350" y1="201" x2="350" y2="325" stroke="#94a3b8" stroke-width="0.75" stroke-dasharray="4 3"/>
<line x1="556" y1="201" x2="556" y2="325" stroke="#94a3b8" stroke-width="0.75" stroke-dasharray="4 3"/>

<!-- Container 2: Activity events (proposed) -->
<rect x="31" y="255" width="638" height="155" rx="20" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5 4"/>
<text x="51" y="280" font-size="14" font-weight="600" fill="#0f172a">Proposed: Agent Tool Activity (T12)</text>
<text x="51" y="298" font-size="12" fill="#475569">What the model actually invoked</text>

<rect x="51" y="325" width="186" height="56" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
<text x="144" y="343" font-size="14" font-weight="600" fill="#334155" text-anchor="middle" dominant-baseline="central">No invocation</text>
<text x="144" y="361" font-size="12" fill="#64748b" text-anchor="middle" dominant-baseline="central">search, calc bound</text>

<rect x="257" y="325" width="186" height="56" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
<text x="350" y="343" font-size="14" font-weight="600" fill="#166534" text-anchor="middle" dominant-baseline="central">Captured</text>
<text x="350" y="361" font-size="12" fill="#15803d" text-anchor="middle" dominant-baseline="central">search &#183; digest 9f2a</text>

<rect x="463" y="325" width="186" height="56" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
<text x="556" y="343" font-size="14" font-weight="600" fill="#b91c1c" text-anchor="middle" dominant-baseline="central">No record</text>
<text x="556" y="361" font-size="12" fill="#dc2626" text-anchor="middle" dominant-baseline="central">delete_file: unknown</text>

<!-- Conclusion banner -->
<rect x="31" y="430" width="638" height="54" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="350" y="448" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle" dominant-baseline="central">Both must be captured, and both must be portable</text>
<text x="350" y="466" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="central">Inventory proves availability. Activity proves action. Neither survives on one engine alone.</text>

<!-- Legend -->
<circle cx="60" cy="502" r="5" fill="#3b82f6"/>
<text x="72" y="502" font-size="12" fill="#475569" dominant-baseline="central">Inventory (always present)</text>
<circle cx="290" cy="502" r="5" fill="#22c55e"/>
<text x="302" y="502" font-size="12" fill="#475569" dominant-baseline="central">Activity (captured)</text>
<circle cx="470" cy="502" r="5" fill="#ef4444"/>
<text x="482" y="502" font-size="12" fill="#475569" dominant-baseline="central">Activity (gap)</text>
</svg>
